# ===== Common settings (shared by local/prod) =====
spring.application.name=backend

# Active profile. Defaults to "local" when nothing is set.
# On production servers, override with the env var SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server port. Cloud platforms (Railway, etc.) inject $PORT; fall back to SERVER_PORT, then 8080.
server.port=${PORT:${SERVER_PORT:8080}}

# JPA (common)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Lottery predictor (Python subprocess). Paths are relative to the process working dir;
# override per environment via LOTTERY_* env vars. Default targets the local mini-llm venv.
app.lottery.python-executable=${LOTTERY_PYTHON:mini-llm/.venv/bin/python}
app.lottery.script-path=${LOTTERY_SCRIPT:mini-llm/11_lottery_nn_predict.py}
app.lottery.max-count=${LOTTERY_MAX_COUNT:100}
app.lottery.timeout-seconds=${LOTTERY_TIMEOUT_SECONDS:30}

# Environment-specific settings live in:
#   - local (development): application-local.properties
#   - production:          application-prod.properties
