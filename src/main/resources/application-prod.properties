# ===== Production only =====
# Do not hard-code secrets (DB credentials, etc.) here — inject them via env vars.
# Example (on the server):
#   export SPRING_PROFILES_ACTIVE=prod
#   export DB_URL=jdbc:postgresql://<host>:5432/<db>
#   export DB_USERNAME=<user>
#   export DB_PASSWORD=<password>
#   export APP_CORS_ALLOWED_ORIGINS=https://your-domain.com
#   java -jar backend.jar

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# First deploy: auto-create the schema so the app comes up cleanly.
# Hardening TODO: switch to `validate` + Flyway/Liquibase migrations once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS: allow only the real frontend domain(s). Comma-separated for multiple.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# JWT + seeded admin (inject all as env vars; never commit real values).
# JWT_SECRET must be at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# Logging
logging.level.root=INFO
logging.level.com.sg.backend=INFO
