# Test-only settings — use in-memory H2 so builds/tests run without a local Postgres.
# Set the 'test' profile explicitly so local/prod settings don't leak in.
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# CORS origins are irrelevant in tests; fill with a placeholder.
app.cors.allowed-origins=http://localhost:5173

# JWT + seeded admin (test values).
app.jwt.secret=test-jwt-secret-0123456789-0123456789-0123456789
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.admin.username=admin
app.admin.password=admin
app.user.username=user
app.user.password=user

# Lottery predictor (test placeholders; the script is not invoked in tests).
app.lottery.python-executable=python3
app.lottery.script-path=predictor/11_lottery_nn_predict.py
app.lottery.max-count=100
app.lottery.timeout-seconds=30
